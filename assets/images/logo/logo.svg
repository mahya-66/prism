<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="75"
  height="75"
>
  <defs>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9faff"/>
      <stop offset="45%" stop-color="#61d5f0"/>
      <stop offset="100%" stop-color="#5369bd"/>
    </linearGradient>

    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
